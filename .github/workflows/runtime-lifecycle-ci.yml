name: runtime-lifecycle-ci
on:
  push:
    branches:
      - fix/app-server-timeout-lifecycle
  pull_request:

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/codex-app-server-lifecycle.mjs
      - run: node --test test/codex-account-security.mjs
